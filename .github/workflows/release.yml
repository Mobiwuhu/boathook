name: Release boathook

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment
        required: true
        type: choice
        default: initial
        options:
          - initial
          - patch
          - minor
          - major
      dry_run:
        description: Validate and upload artifacts for review
        type: boolean
        default: true
      with_plugins:
        description: Also build the archive with the optional headers plugin
        type: boolean
        default: false

concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
         (github.event_name == 'workflow_run' &&
          (github.event.workflow_run.event != 'push' ||
           github.event.workflow_run.conclusion != 'success' ||
           github.event.workflow_run.head_sha != github.sha))) &&
        format('release-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Select the tested release source
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_enabled: ${{ steps.select.outputs.release_enabled }}
      release_type: ${{ steps.select.outputs.release_type }}
      base_version: ${{ steps.select.outputs.base_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check CI and select the version base
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TYPE: ${{ github.event_name == 'workflow_run' && 'patch' || inputs.release_type || 'initial' }}
        run: |
          source_commit=$(git rev-parse HEAD)
          if [[ "$DRY_RUN" != true ]]; then
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
              echo 'Run the publish workflow from main.' >&2
              exit 1
            fi
            git merge-base --is-ancestor "$source_commit" origin/main
            if [[ "$GITHUB_EVENT_NAME" != workflow_run ]]; then
              ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push \
                --branch main --commit "$source_commit" --status success --limit 1 \
                --json databaseId --jq '.[0].databaseId // empty')
              if [[ -z "$ci" ]]; then
                echo 'The release commit needs a successful CI run on main.' >&2
                exit 1
              fi
            fi
          fi

          latest_tag=
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              latest_tag="$tag"
              break
            fi
          done < <(git tag --list 'v[0-9]*' --sort=-version:refname)
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && -n "$latest_tag" ]] &&
            git merge-base --is-ancestor "$source_commit" "$latest_tag"; then
            echo "This commit is already included in $latest_tag."
            exit 0
          fi
          printf 'base_version=%s\nrelease_type=%s\nrelease_enabled=true\n' \
            "${latest_tag#v}" "$RELEASE_TYPE" >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify ${{ matrix.platform }}
    needs: plan
    if: ${{ needs.plan.outputs.release_enabled == 'true' }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      RELEASE_PLATFORM: ${{ matrix.platform }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Prepare the shared version
        id: version
        env:
          RELEASE_TYPE: ${{ needs.plan.outputs.release_type }}
          BASE_VERSION: ${{ needs.plan.outputs.base_version }}
        run: bun scripts/prepare-release.ts "$RELEASE_TYPE" "$BASE_VERSION"
      - name: Check release tag
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "v$RELEASE_VERSION" ]]; then
            printf 'Tag must match the release version (v%s).\n' "$RELEASE_VERSION" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Build release archives
        env:
          WITH_PLUGINS: ${{ inputs.with_plugins }}
        run: |
          args=()
          if [[ "$RELEASE_PLATFORM" == linux-x64 ]]; then
            args+=(--npm-packages)
          fi
          if [[ "$WITH_PLUGINS" == true ]]; then
            args+=(--with-plugins)
          fi
          bun run release "${args[@]}"
      - name: Prepare Chrome system libraries
        if: runner.os == 'Linux'
        run: bun ./node_modules/playwright/cli.js install-deps chromium
      - name: Install and test the release artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$RELEASE_PLATFORM" == linux-x64 ]]; then
            export BOATHOOK_SMOKE_NPM_DIR=dist/npm
          fi
          bun run test:release "dist/boathook-$RELEASE_PLATFORM-$RELEASE_VERSION"*.tar.gz
      - name: Save the version changes
        if: runner.os == 'Linux'
        run: git diff --binary HEAD > dist/release.patch
      - uses: actions/upload-artifact@v4
        with:
          name: boathook-release-${{ matrix.platform }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          path: |
            dist/boathook-${{ matrix.platform }}-${{ steps.version.outputs.version }}*.tar.gz
            dist/npm/*.tgz
            dist/release.patch

  publish:
    name: Publish to GitHub Releases and npm
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: boathook-release-*
          merge-multiple: true
          path: dist
      - name: Check the verified npm tarballs
        run: bun scripts/publish-release-packages.ts dist/npm "$RELEASE_VERSION" --check
      - name: Commit and tag the verified version
        run: |
          tag="v$RELEASE_VERSION"
          source_commit=$(git rev-parse HEAD)
          git fetch --tags origin main
          git merge-base --is-ancestor "$source_commit" origin/main
          test -f dist/release.patch
          if [[ -s dist/release.patch ]]; then
            git apply --index dist/release.patch
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{tree}")" = "$(git write-tree)"
            git merge-base --is-ancestor "$source_commit" "$tag"
          else
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m "chore: release $tag"
            fi
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
      - name: Publish the verified npm tarballs with OIDC
        run: bun scripts/publish-release-packages.ts dist/npm "$RELEASE_VERSION"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$RELEASE_VERSION"
          release=$(mktemp)
          existing=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > "$release"; then
            existing=true
          else
            printf '%s\n' '{"isDraft":false,"assets":[]}' > "$release"
          fi
          asset_digest() {
            jq -r --arg name "$1" '.assets[] | select(.name == $name and .state == "uploaded") | .digest // empty' "$release"
          }
          files=()
          for platform in linux-x64 darwin-arm64 darwin-x64; do
            archive="boathook-$platform-$RELEASE_VERSION.tar.gz"
            checksum="boathook-$platform.sha256"
            archive_digest=$(asset_digest "$archive")
            if [[ -n $archive_digest ]]; then
              [[ $archive_digest =~ ^sha256:[0-9a-f]{64}$ ]]
              printf '%s  %s\n' "${archive_digest#sha256:}" "$archive" > "dist/$checksum"
            else
              (cd dist && sha256sum "$archive" > "$checksum")
              files+=("dist/$archive")
            fi
            checksum_digest=$(asset_digest "$checksum")
            if [[ -z $checksum_digest ]]; then
              files+=("dist/$checksum")
            else
              read -r expected _ < <(sha256sum "dist/$checksum")
              if [[ $checksum_digest != "sha256:$expected" ]]; then
                printf 'The published checksum file %s does not match %s.\n' "$checksum" "$archive" >&2
                exit 1
              fi
            fi
          done
          if [[ $existing == true ]]; then
            for file in "${files[@]}"; do
              gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
            done
            if jq -e '.isDraft' "$release" > /dev/null; then
              gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${files[@]}"
          fi
